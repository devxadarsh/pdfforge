<div
  [class.psec__group]="bare()"
  [class.psec]="!bare()"
  [class.psec--collapsed]="!bare() && collapsible() && isCollapsed()"
>
  @if (bare()) {
    <div class="psec__subtitle">
      @if (icon()) {
        <i [ngClass]="icon()" class="psec__subicon"></i>
      }
      <span>{{ title() }}</span>
      @if (count() !== null) {
        <span class="psec__count">{{ count() }}</span>
      }
    </div>
  } @else {
    <button
      type="button"
      class="psec__head"
      [class.psec__head--static]="!collapsible()"
      [attr.aria-expanded]="collapsible() ? !isCollapsed() : null"
      [disabled]="!collapsible()"
      (click)="toggle()"
    >
      <span class="psec__title">
        @if (icon()) {
          <i [ngClass]="icon()" class="psec__icon"></i>
        }
        <span class="psec__label">{{ title() }}</span>
        @if (count() !== null) {
          <span class="psec__count">{{ count() }}</span>
        }
      </span>
      <span class="psec__actions">
        <ng-content select="[psec-actions]" />
        @if (collapsible()) {
          <i class="fa-solid fa-chevron-down psec__chev"></i>
        }
      </span>
    </button>
  }

  @if (bare() || !collapsible() || !isCollapsed()) {
    <div class="psec__body" [class.psec__body--bare]="bare()">
      <ng-content />
    </div>
  }
</div>
