<div class="editor-shell">
  <header class="editor-shell__header">
    <div class="editor-shell__header-left">
      <button
        class="pf-icon-btn"
        type="button"
        (click)="back()"
        title="Back to home"
        aria-label="Back to home"
      >
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div class="editor-shell__doc">
        <span class="editor-shell__doc-name" [title]="documentName()">{{ documentName() }}</span>
        <span class="editor-shell__doc-status">
          <i class="fa-solid fa-cloud-arrow-down"></i> Saved locally
        </span>
      </div>
    </div>

    <nav class="editor-shell__nav" aria-label="Editor sections">
      @for (item of editorNav; track item.path) {
        <a
          class="editor-shell__nav-link"
          [routerLink]="item.path"
          routerLinkActive="editor-shell__nav-link--active"
          [routerLinkActiveOptions]="{ exact: item.path === '/editor' }"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="editor-shell__header-right">
      <button
        class="pf-icon-btn"
        type="button"
        [disabled]="!canUndo()"
        (click)="undo()"
        title="Undo (Ctrl+Z)"
        aria-label="Undo"
      >
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button
        class="pf-icon-btn"
        type="button"
        [disabled]="!canRedo()"
        (click)="redo()"
        title="Redo (Ctrl+Y)"
        aria-label="Redo"
      >
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <button
        class="pf-icon-btn"
        type="button"
        (click)="cycleTheme()"
        [title]="'Theme: ' + theme.theme()"
        [attr.aria-label]="'Theme: ' + theme.theme()"
      >
        <i class="fa-solid" [ngClass]="themeIcon()"></i>
      </button>
      <button
        class="pf-btn pf-btn--primary editor-shell__download-btn"
        type="button"
        [disabled]="!hasDocument() || isExporting()"
        (click)="download()"
        title="Download / Export edited PDF"
        aria-label="Download / Export edited PDF"
      >
        @if (isExporting()) {
          <i class="fa-solid fa-spinner fa-spin"></i>
          <span class="editor-shell__btn-text">Saving…</span>
        } @else {
          <i class="fa-solid fa-download"></i>
          <span class="editor-shell__btn-text">Download</span>
        }
      </button>
    </div>
  </header>

  <div class="editor-shell__body">
    <router-outlet />
  </div>
</div>
