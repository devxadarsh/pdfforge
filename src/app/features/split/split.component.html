<section class="tool-page">
  <div class="pf-container">
    <header class="tool-page__header">
      <a class="tool-page__back" routerLink="/tools"><i class="fa-solid fa-arrow-left"></i> Tools</a>
      <h1><i class="fa-solid fa-scissors tool-page__icon"></i> Split PDF</h1>
      <p class="pf-text-muted">
        Extract pages or split by range. Everything stays on your device.
      </p>
    </header>

    <div class="tool-page__body">
      <app-file-dropzone
        [multiple]="false"
        label="Add a PDF to split"
        (filesLoaded)="onFileLoaded($event)"
      />

      @if (loadedFile()) {
        <div class="d-flex align-items-center justify-content-between p-3 my-3 bg-white border rounded">
          <div class="d-flex align-items-center gap-3">
            <i class="fa-solid fa-file-pdf text-danger fs-3"></i>
            <div>
              <div class="fw-semibold">{{ loadedFile()!.name }}</div>
              <small class="text-muted">{{ formatBytes(loadedFile()!.sizeBytes) }} • {{ pageCount() }} page{{ pageCount() === 1 ? '' : 's' }}</small>
            </div>
          </div>
          <button class="btn btn-sm btn-outline-secondary" type="button" (click)="clearFile()">
            <i class="fa-solid fa-xmark"></i> Change
          </button>
        </div>
      }

      <div class="split-modes">
        <button
          type="button"
          class="split-mode"
          [class.split-mode--active]="mode() === 'every'"
          (click)="setMode('every')"
        >
          <i class="fa-solid fa-grid-2"></i>
          <span>Split every page</span>
        </button>
        <button
          type="button"
          class="split-mode"
          [class.split-mode--active]="mode() === 'range'"
          (click)="setMode('range')"
        >
          <i class="fa-solid fa-list"></i>
          <span>Custom range</span>
        </button>
      </div>

      @if (mode() === 'range') {
        <label class="split-range">
          <span class="pf-label-caps">Page ranges</span>
          <input
            class="pf-input"
            type="text"
            [value]="range()"
            (input)="range.set($any($event.target).value)"
            placeholder="e.g. 1-3, 5, 8-10"
          />
          <small class="pf-text-muted">Separate ranges with commas.</small>
        </label>
      }

      <div class="tool-page__footer">
        <button
          class="pf-btn pf-btn--primary"
          type="button"
          [disabled]="!loadedFile() || splitting()"
          (click)="split()"
        >
          @if (splitting()) {
            <i class="fa-solid fa-spinner fa-spin me-2"></i> Splitting…
          } @else {
            <i class="fa-solid fa-scissors me-2"></i> Split PDF
          }
        </button>
      </div>
    </div>

    <p class="tool-page__privacy">
      <i class="fa-solid fa-lock"></i> Files never leave your device.
    </p>
  </div>
</section>
