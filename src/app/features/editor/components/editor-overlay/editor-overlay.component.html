<svg
  #svg
  class="overlay"
  [attr.width]="width()"
  [attr.height]="height()"
  [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
  [class.overlay--interactive]="interactive()"
  [class.overlay--drawing]="isDrawingTool()"
  [style.pointerEvents]="interactive() ? 'auto' : 'none'"
  [style.touchAction]="touchAction()"
  [style.cursor]="cursor()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointerleave)="onPointerLeave()"
  (dblclick)="onDblClick($event)"
  (contextmenu)="onContextMenu($event)"
>
  <defs>
    @for (a of arrowMarkers(); track a.id) {
      <marker
        [id]="'ah-' + a.id"
        markerWidth="10"
        markerHeight="10"
        refX="8"
        refY="3"
        orient="auto"
        markerUnits="strokeWidth"
      >
        <path d="M0,0 L8,3 L0,6 Z" [attr.fill]="a.strokeColor" />
      </marker>
    }
  </defs>

  @for (a of annotations(); track a.id) {
    @switch (a.type) {
      @case ('shape') {
        @if (a.renderMode === 'icon') {
          <g [attr.transform]="rotateTransform(a)">
            <foreignObject
              [attr.x]="a.rect.x"
              [attr.y]="a.rect.y"
              [attr.width]="a.rect.width"
              [attr.height]="a.rect.height"
              [attr.opacity]="a.opacity"
              style="overflow: visible; pointer-events: none;"
            >
              <div
                xmlns="http://www.w3.org/1999/xhtml"
                [ngStyle]="getIconBoxStyle(a)"
              >
                <i
                  [class]="getShapeIconClass(a)"
                  [ngStyle]="getIconGlyphStyle(a)"
                ></i>
              </div>
            </foreignObject>
          </g>
        } @else if (a.kind === 'line') {
          <line
            [attr.x1]="a.rect.x"
            [attr.y1]="a.rect.y"
            [attr.x2]="a.rect.x + a.rect.width"
            [attr.y2]="a.rect.y + a.rect.height"
            [attr.stroke]="a.strokeColor"
            [attr.stroke-width]="a.strokeWidth"
            [attr.stroke-dasharray]="strokeDashFor(a)"
            [attr.opacity]="a.opacity"
            [attr.transform]="rotateTransform(a)"
          />
        } @else {
          <g [attr.transform]="getShapeTransform(a)">
            <path
              [attr.d]="getShapePath(a)"
              [attr.fill]="a.fillColor"
              [attr.stroke]="a.strokeColor"
              [attr.stroke-width]="a.strokeWidth"
              [attr.stroke-dasharray]="strokeDashFor(a)"
              [attr.opacity]="a.opacity"
            />
          </g>
        }
      }
      @case ('drawing') {
        <path
          [attr.d]="pointsToSvgPath(a.points)"
          [attr.stroke]="a.color"
          [attr.stroke-width]="a.strokeWidth"
          [attr.opacity]="a.opacity"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
          [attr.transform]="rotateTransform(a)"
        />
      }
      @case ('text') {
        @if (a.backgroundColor && a.backgroundColor !== 'transparent') {
          <rect
            [attr.x]="a.rect.x - textBackgroundPadding(a)"
            [attr.y]="a.rect.y - textBackgroundPadding(a)"
            [attr.width]="a.rect.width + textBackgroundPadding(a) * 2"
            [attr.height]="a.rect.height + textBackgroundPadding(a) * 2"
            [attr.fill]="a.backgroundColor"
            rx="4"
            [attr.opacity]="a.opacity"
            [attr.transform]="rotateTransform(a)"
          />
        }
        <text
          [attr.font-size]="a.fontSize"
          [attr.font-family]="a.fontFamily"
          [attr.font-weight]="a.fontWeight"
          [attr.font-style]="a.italic ? 'italic' : 'normal'"
          [attr.text-decoration]="a.underline ? 'underline' : 'none'"
          [attr.letter-spacing]="a.letterSpacing ? a.letterSpacing + 'px' : null"
          [attr.fill]="a.color"
          [attr.opacity]="a.opacity"
          [attr.text-anchor]="
            a.align === 'center'
              ? 'middle'
              : a.align === 'right'
                ? 'end'
                : 'start'
          "
          [attr.transform]="rotateTransform(a)"
        >
          @for (line of textLines(transformText(a.text, a.transform)); track $index) {
            <tspan
              [attr.x]="textAnchorX(a)"
              [attr.y]="lineBaselineY(a, $index)"
              >{{ line }}</tspan
            >
          }
        </text>
      }
      @case ('highlight') {
        <rect
          [attr.x]="a.rect.x"
          [attr.y]="a.rect.y"
          [attr.width]="a.rect.width"
          [attr.height]="a.rect.height"
          [attr.fill]="a.color"
          [attr.fill-opacity]="0.4"
          [attr.opacity]="a.opacity"
          [attr.transform]="rotateTransform(a)"
        />
      }
      @case ('underline') {
        <line
          [attr.x1]="a.rect.x"
          [attr.y1]="a.rect.y + a.rect.height - 2"
          [attr.x2]="a.rect.x + a.rect.width"
          [attr.y2]="a.rect.y + a.rect.height - 2"
          [attr.stroke]="a.color"
          [attr.stroke-width]="2"
          [attr.opacity]="a.opacity"
          [attr.transform]="rotateTransform(a)"
        />
      }
      @case ('strikethrough') {
        <line
          [attr.x1]="a.rect.x"
          [attr.y1]="a.rect.y + a.rect.height / 2"
          [attr.x2]="a.rect.x + a.rect.width"
          [attr.y2]="a.rect.y + a.rect.height / 2"
          [attr.stroke]="a.color"
          [attr.stroke-width]="2"
          [attr.opacity]="a.opacity"
          [attr.transform]="rotateTransform(a)"
        />
      }
      @case ('comment') {
        <g class="comment" (dblclick)="startEditingComment(a, $event)" [attr.transform]="rotateTransform(a)">
          <circle
            [attr.cx]="a.rect.x + a.rect.width / 2"
            [attr.cy]="a.rect.y + a.rect.height / 2"
            [attr.r]="a.rect.width / 2"
            fill="#f59e0b"
            stroke="#d97706"
            stroke-width="1.5"
            [attr.opacity]="a.opacity"
          />
          <text
            [attr.x]="a.rect.x + a.rect.width / 2"
            [attr.y]="a.rect.y + a.rect.height / 2 + Math.round(a.rect.height * 0.18)"
            text-anchor="middle"
            fill="#ffffff"
            [attr.font-size]="Math.max(10, Math.round(a.rect.width * 0.52))"
            font-weight="700"
            style="user-select: none; pointer-events: none;"
          >!</text>

          @if (a.id === selectedId() && editingCommentId() !== a.id) {
            <g
              class="comment__bubble"
              [attr.transform]="
                'translate(' + (a.rect.x + a.rect.width + 6) + ',' + a.rect.y + ')'
              "
              (dblclick)="startEditingComment(a, $event)"
              (pointerdown)="$event.stopPropagation()"
              style="cursor: pointer;"
            >
              <rect
                width="180"
                height="50"
                rx="8"
                fill="#fffbeb"
                stroke="#f59e0b"
                stroke-width="1.5"
              />
              <text x="10" y="22" font-size="12" font-weight="500" fill="#1f2937">
                {{ a.text.length > 24 ? a.text.slice(0, 22) + '…' : a.text }}
              </text>
              <text x="10" y="38" font-size="10" fill="#b45309" font-style="italic">
                Double-click to edit
              </text>
            </g>
          }
        </g>
      }
      @case ('image') {
        <image
          [attr.href]="a.dataUrl"
          [attr.x]="a.rect.x"
          [attr.y]="a.rect.y"
          [attr.width]="a.rect.width"
          [attr.height]="a.rect.height"
          preserveAspectRatio="none"
          [attr.opacity]="a.opacity"
          [style.mix-blend-mode]="a.blendMode || 'normal'"
          [attr.transform]="imageTransform(a)"
        />
      }
      @case ('signature') {
        <image
          [attr.href]="a.dataUrl"
          [attr.x]="a.rect.x"
          [attr.y]="a.rect.y"
          [attr.width]="a.rect.width"
          [attr.height]="a.rect.height"
          preserveAspectRatio="none"
          [attr.opacity]="a.opacity"
          [style.mix-blend-mode]="a.blendMode || 'normal'"
          [attr.transform]="rotateTransform(a)"
        />
      }
      @case ('stamp') {
        <g [attr.transform]="rotateTransform(a)">
          <rect
            [attr.x]="a.rect.x"
            [attr.y]="a.rect.y"
            [attr.width]="a.rect.width"
            [attr.height]="a.rect.height"
            rx="6"
            [attr.fill]="stampFill(a)"
            [attr.stroke]="a.color"
            stroke-width="3"
            [attr.opacity]="a.opacity"
          />
          <rect
            [attr.x]="a.rect.x + 3"
            [attr.y]="a.rect.y + 3"
            [attr.width]="a.rect.width - 6"
            [attr.height]="a.rect.height - 6"
            rx="4"
            fill="none"
            [attr.stroke]="a.color"
            stroke-width="1"
            [attr.opacity]="a.opacity"
          />
          <text
            [attr.x]="a.rect.x + a.rect.width / 2"
            [attr.y]="a.rect.y + a.rect.height / 2"
            dominant-baseline="central"
            text-anchor="middle"
            [attr.fill]="a.color"
            [attr.font-size]="stampFontSize(a)"
            font-family="'Impact', 'Arial Black', sans-serif"
            font-weight="900"
            letter-spacing="2px"
            [attr.opacity]="a.opacity"
          >
            {{ a.text }}
          </text>
        </g>
      }
    }

    @if (tool() === 'select' && isSelected(a.id)) {
      <g [attr.transform]="rotateTransform(a)">
        <rect
          class="sel"
          [class.sel--locked]="a.locked"
          [attr.x]="a.rect.x"
          [attr.y]="a.rect.y"
          [attr.width]="a.rect.width"
          [attr.height]="a.rect.height"
        />
        <!-- Expanded border drag touch target for mobile devices -->
        @if (isMobile() && !a.locked) {
          <rect
            class="sel-touch-border"
            [attr.x]="a.rect.x - 12"
            [attr.y]="a.rect.y - 12"
            [attr.width]="a.rect.width + 24"
            [attr.height]="a.rect.height + 24"
            fill="none"
            stroke="transparent"
            stroke-width="24"
            style="pointer-events: stroke; cursor: move;"
          />
        }
        @if (a.locked) {
          <g
            class="lock-badge"
            [attr.transform]="'translate(' + (a.rect.x + a.rect.width - 20) + ',' + (a.rect.y - 10) + ')'"
          >
            <circle cx="9" cy="9" r="9" fill="#1f2937" />
            <path
              d="M6 7V5.5a3 3 0 0 1 6 0V7h.5A1.5 1.5 0 0 1 14 8.5v4a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 4 12.5v-4A1.5 1.5 0 0 1 5.5 7H6zm1.5 0h3V5.5a1.5 1.5 0 0 0-3 0V7z"
              fill="#f59e0b"
              transform="scale(0.8) translate(2, 2)"
            />
          </g>
        } @else if (state.selectedIds().length === 1) {
          <g class="handles" [class.handles--mobile]="isMobile()">
            @for (h of getHandles(a.rect); track h.key) {
              <g class="handle-target" (pointerdown)="onHandleDown($event, h.key)">
                @if (isMobile()) {
                  <rect
                    class="handle-hit"
                    [attr.x]="h.cx - 20"
                    [attr.y]="h.cy - 20"
                    width="40"
                    height="40"
                    fill="transparent"
                    style="pointer-events: all;"
                  />
                }
                <rect
                  class="handle"
                  [attr.x]="h.cx - (isMobile() ? 7 : 6)"
                  [attr.y]="h.cy - (isMobile() ? 7 : 6)"
                  [attr.width]="isMobile() ? 14 : 12"
                  [attr.height]="isMobile() ? 14 : 12"
                  rx="3"
                  [style.cursor]="handleCursor(h.key, a.rotation)"
                  style="pointer-events: all;"
                />
              </g>
            }
          </g>
        }
      </g>
    }
  }

  @if (draft(); as d) {
    @if (d.type === 'line') {
      <line
        class="draft"
        [attr.x1]="d.x"
        [attr.y1]="d.y"
        [attr.x2]="d.x + d.width"
        [attr.y2]="d.y + d.height"
      />
    } @else if (d.type === 'highlight' || d.type === 'underline' || d.type === 'strikethrough') {
      <rect
        class="draft"
        [attr.x]="d.x"
        [attr.y]="d.y"
        [attr.width]="d.width"
        [attr.height]="d.height"
      />
    } @else {
      @if (state.shapeRenderMode() === 'icon') {
        <g [attr.transform]="'translate(' + d.x + ',' + d.y + ')'">
          <rect
            class="draft"
            [attr.x]="0"
            [attr.y]="0"
            [attr.width]="d.width"
            [attr.height]="d.height"
            rx="6"
          />
          <foreignObject
            [attr.x]="0"
            [attr.y]="0"
            [attr.width]="d.width"
            [attr.height]="d.height"
            style="overflow: visible; pointer-events: none;"
          >
            <div
              xmlns="http://www.w3.org/1999/xhtml"
              [ngStyle]="getDraftIconBoxStyle()"
            >
              <i
                [class]="activeShapeIconClass()"
                [ngStyle]="getDraftIconGlyphStyle()"
              ></i>
            </div>
          </foreignObject>
        </g>
      } @else {
        <g [attr.transform]="'translate(' + d.x + ',' + d.y + ')'">
          <path
            class="draft"
            [attr.d]="getDraftShapePath(d)"
          />
        </g>
      }
    }
  }

  @if (draftDrawing(); as dd) {
    <path
      [attr.d]="pointsToSvgPath(dd.points)"
      [attr.stroke]="dd.color"
      [attr.stroke-width]="dd.strokeWidth"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.85"
    />
  }

  @if (tool() === 'eraser' && eraserPos(); as ep) {
    <!-- Nominal tool size boundary ring (when different from cut size) -->
    @if (baseEraserRadius() !== eraserRadius()) {
      <circle
        [attr.cx]="ep.x"
        [attr.cy]="ep.y"
        [attr.r]="baseEraserRadius()"
        fill="none"
        stroke="#94a3b8"
        stroke-width="1"
        stroke-dasharray="2 2"
        pointer-events="none"
      />
    }
    <!-- Actual precision cut footprint -->
    <circle
      [attr.cx]="ep.x"
      [attr.cy]="ep.y"
      [attr.r]="eraserRadius()"
      fill="rgba(239, 68, 68, 0.18)"
      stroke="#ef4444"
      stroke-width="1.5"
      stroke-dasharray="3 2"
      pointer-events="none"
    />
    <!-- Center pivot point -->
    <circle
      [attr.cx]="ep.x"
      [attr.cy]="ep.y"
      r="2"
      fill="#ef4444"
      pointer-events="none"
    />
  }

  <!-- Multi-Selection / Group Combined Bounding Box -->
  @if (tool() === 'select' && multiSelectionBounds(); as mb) {
    <rect
      class="sel sel--multi"
      [class.sel--group]="isGroupSelected()"
      [attr.x]="mb.x"
      [attr.y]="mb.y"
      [attr.width]="mb.width"
      [attr.height]="mb.height"
      fill="none"
      stroke="#2563eb"
      stroke-width="1.5"
      [attr.stroke-dasharray]="isGroupSelected() ? 'none' : '4 3'"
      pointer-events="none"
    />
    @if (isGroupSelected()) {
      <g
        class="group-badge"
        [attr.transform]="'translate(' + mb.x + ',' + Math.max(0, mb.y - 20) + ')'"
        pointer-events="none"
      >
        <rect
          x="0"
          y="0"
          [attr.width]="64 + state.selectedIds().length.toString().length * 8"
          height="18"
          rx="4"
          fill="#2563eb"
        />
        <text
          x="6"
          y="13"
          font-size="10"
          font-family="sans-serif"
          font-weight="600"
          fill="#ffffff"
        >Group ({{ state.selectedIds().length }})</text>
      </g>
    }
  }

  <!-- Active Marquee Selection Box -->
  @if (draftBox(); as b) {
    <rect
      [attr.x]="b.x"
      [attr.y]="b.y"
      [attr.width]="b.width"
      [attr.height]="b.height"
      fill="rgba(37, 99, 235, 0.12)"
      stroke="#2563eb"
      stroke-width="1.5"
      stroke-dasharray="3 3"
      pointer-events="none"
    />
  }

  <!-- Active Freehand Lasso Selection Path -->
  @if (draftLasso(); as pts) {
    <path
      [attr.d]="pointsToSvgPath(pts) + ' Z'"
      fill="rgba(37, 99, 235, 0.12)"
      stroke="#2563eb"
      stroke-width="1.5"
      stroke-dasharray="3 3"
      pointer-events="none"
    />
  }

  <!-- Pending Placement Ghost Preview (Image / Stamp) -->
  @if (state.pendingPlacement(); as pending) {
    @if (pendingPos(); as pos) {
      <g
        class="placement-preview"
        [attr.transform]="
          'translate(' +
          Math.max(0, Math.min(width() - pending.width, Math.round(pos.x - pending.width / 2))) +
          ',' +
          Math.max(0, Math.min(height() - pending.height, Math.round(pos.y - pending.height / 2))) +
          ')'
        "
        style="pointer-events: none;"
      >
        @if (pending.type === 'image') {
          <rect
            [attr.width]="pending.width"
            [attr.height]="pending.height"
            rx="4"
            fill="rgba(37, 99, 235, 0.1)"
            stroke="#2563eb"
            stroke-width="1.5"
            stroke-dasharray="4 3"
          />
          <image
            [attr.href]="pending.dataUrl"
            [attr.width]="pending.width"
            [attr.height]="pending.height"
            opacity="0.65"
            preserveAspectRatio="none"
          />
        } @else if (pending.type === 'stamp') {
          <rect
            [attr.width]="pending.width"
            [attr.height]="pending.height"
            rx="6"
            fill="rgba(255, 255, 255, 0.85)"
            [attr.stroke]="pending.color"
            stroke-width="2"
            stroke-dasharray="4 3"
            opacity="0.8"
          />
          <text
            [attr.x]="pending.width / 2"
            [attr.y]="pending.height / 2 + 5"
            text-anchor="middle"
            [attr.fill]="pending.color"
            font-size="16"
            font-weight="700"
            letter-spacing="2"
            opacity="0.8"
          >
            {{ pending.text }}
          </text>
        }
      </g>
    }
  }
</svg>

@if (editingText(); as t) {
  <textarea
    #textEditor
    class="text-editor"
    wrap="off"
    spellcheck="false"
    [style.left.px]="t.rect.x"
    [style.top.px]="t.rect.y"
    [style.width.px]="Math.max(t.rect.width, 70)"
    [style.min-width.px]="70"
    [style.height.px]="Math.max(t.rect.height, 28)"
    [style.font-size.px]="Math.max(t.fontSize, 13)"
    [style.font-family]="t.fontFamily"
    [style.font-weight]="t.fontWeight"
    [style.font-style]="t.italic ? 'italic' : 'normal'"
    [style.text-decoration]="t.underline ? 'underline' : 'none'"
    [style.color]="t.color"
    [style.text-align]="t.align"
    [style.text-transform]="t.transform ?? 'none'"
    [style.line-height]="t.lineHeight ?? 1.35"
    [style.letter-spacing.px]="t.letterSpacing ?? 0"
    [style.background-color]="t.backgroundColor && t.backgroundColor !== 'transparent' ? t.backgroundColor : 'rgba(255, 255, 255, 0.95)'"
    (input)="onEditInput($event)"
    (blur)="stopEditing()"
    (keydown)="onEditKeydown($event)"
    (pointerdown)="$event.stopPropagation()"
    (touchstart)="$event.stopPropagation()"
  ></textarea>
}

@if (editingComment(); as c) {
  <div
    class="comment-editor-box"
    [style.left.px]="c.rect.x + c.rect.width + 6"
    [style.top.px]="c.rect.y"
    (pointerdown)="$event.stopPropagation()"
    (touchstart)="$event.stopPropagation()"
    (click)="$event.stopPropagation()"
  >
    <textarea
      #commentEditor
      class="comment-editor-textarea"
      [value]="c.text"
      (input)="onCommentInput($event, c)"
      (blur)="stopEditingComment(c)"
      (keydown)="onCommentKeydown($event, c)"
      placeholder="Type comment..."
      rows="2"
    ></textarea>
    <div class="comment-editor-actions">
      <span class="comment-editor-tip">Enter to save</span>
      <button type="button" class="comment-editor-btn" (click)="stopEditingComment(c)">
        <i class="fa-solid fa-check"></i> Done
      </button>
    </div>
  </div>
}
