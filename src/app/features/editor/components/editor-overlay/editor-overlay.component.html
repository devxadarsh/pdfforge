<svg
  #svg
  class="overlay"
  [attr.width]="width()"
  [attr.height]="height()"
  [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
  [class.overlay--interactive]="interactive()"
  [style.pointerEvents]="interactive() ? 'auto' : 'none'"
  [style.cursor]="cursor()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointerleave)="onPointerLeave()"
  (dblclick)="onDblClick($event)"
>
  <defs>
    @for (a of arrowMarkers(); track a.id) {
      <marker
        [id]="'ah-' + a.id"
        markerWidth="10"
        markerHeight="10"
        refX="8"
        refY="3"
        orient="auto"
        markerUnits="strokeWidth"
      >
        <path d="M0,0 L8,3 L0,6 Z" [attr.fill]="a.strokeColor" />
      </marker>
    }
  </defs>

  @for (a of annotations(); track a.id) {
    @switch (a.type) {
      @case ('shape') {
        @switch (a.kind) {
          @case ('rectangle') {
            <rect
              [attr.x]="a.rect.x"
              [attr.y]="a.rect.y"
              [attr.width]="a.rect.width"
              [attr.height]="a.rect.height"
              [attr.fill]="a.fillColor"
              [attr.stroke]="a.strokeColor"
              [attr.stroke-width]="a.strokeWidth"
              [attr.stroke-dasharray]="strokeDashFor(a)"
              [attr.opacity]="a.opacity"
              [attr.transform]="rotateTransform(a)"
            />
          }
          @case ('circle') {
            <ellipse
              [attr.cx]="a.rect.x + a.rect.width / 2"
              [attr.cy]="a.rect.y + a.rect.height / 2"
              [attr.rx]="a.rect.width / 2"
              [attr.ry]="a.rect.height / 2"
              [attr.fill]="a.fillColor"
              [attr.stroke]="a.strokeColor"
              [attr.stroke-width]="a.strokeWidth"
              [attr.stroke-dasharray]="strokeDashFor(a)"
              [attr.opacity]="a.opacity"
              [attr.transform]="rotateTransform(a)"
            />
          }
          @case ('line') {
            <line
              [attr.x1]="a.rect.x"
              [attr.y1]="a.rect.y"
              [attr.x2]="a.rect.x + a.rect.width"
              [attr.y2]="a.rect.y + a.rect.height"
              [attr.stroke]="a.strokeColor"
              [attr.stroke-width]="a.strokeWidth"
              [attr.stroke-dasharray]="strokeDashFor(a)"
              [attr.opacity]="a.opacity"
              [attr.transform]="rotateTransform(a)"
            />
          }
          @case ('arrow') {
            <line
              [attr.x1]="a.rect.x"
              [attr.y1]="a.rect.y"
              [attr.x2]="a.rect.x + a.rect.width"
              [attr.y2]="a.rect.y + a.rect.height"
              [attr.stroke]="a.strokeColor"
              [attr.stroke-width]="a.strokeWidth"
              [attr.stroke-dasharray]="strokeDashFor(a)"
              [attr.opacity]="a.opacity"
              [attr.marker-end]="'url(#ah-' + a.id + ')'"
              [attr.transform]="rotateTransform(a)"
            />
          }
        }
      }
      @case ('drawing') {
        <path
          [attr.d]="pointsToSvgPath(a.points)"
          [attr.stroke]="a.color"
          [attr.stroke-width]="a.strokeWidth"
          [attr.opacity]="a.opacity"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
          [attr.transform]="rotateTransform(a)"
        />
      }
      @case ('text') {
        @if (a.backgroundColor && a.backgroundColor !== 'transparent') {
          <rect
            [attr.x]="a.rect.x - textBackgroundPadding(a)"
            [attr.y]="a.rect.y - textBackgroundPadding(a)"
            [attr.width]="a.rect.width + textBackgroundPadding(a) * 2"
            [attr.height]="a.rect.height + textBackgroundPadding(a) * 2"
            [attr.fill]="a.backgroundColor"
            rx="4"
            [attr.opacity]="a.opacity"
            [attr.transform]="rotateTransform(a)"
          />
        }
        <text
          [attr.font-size]="a.fontSize"
          [attr.font-family]="a.fontFamily"
          [attr.font-weight]="a.fontWeight"
          [attr.font-style]="a.italic ? 'italic' : 'normal'"
          [attr.text-decoration]="a.underline ? 'underline' : 'none'"
          [attr.letter-spacing]="a.letterSpacing ? a.letterSpacing + 'px' : null"
          [attr.fill]="a.color"
          [attr.opacity]="a.opacity"
          [attr.text-anchor]="
            a.align === 'center'
              ? 'middle'
              : a.align === 'right'
                ? 'end'
                : 'start'
          "
          [attr.transform]="rotateTransform(a)"
        >
          @for (line of textLines(transformText(a.text, a.transform)); track $index) {
            <tspan
              [attr.x]="textAnchorX(a)"
              [attr.y]="lineBaselineY(a, $index)"
              >{{ line }}</tspan
            >
          }
        </text>
      }
      @case ('highlight') {
        <rect
          [attr.x]="a.rect.x"
          [attr.y]="a.rect.y"
          [attr.width]="a.rect.width"
          [attr.height]="a.rect.height"
          [attr.fill]="a.color"
          [attr.fill-opacity]="0.4"
          [attr.opacity]="a.opacity"
        />
      }
      @case ('underline') {
        <line
          [attr.x1]="a.rect.x"
          [attr.y1]="a.rect.y + a.rect.height - 2"
          [attr.x2]="a.rect.x + a.rect.width"
          [attr.y2]="a.rect.y + a.rect.height - 2"
          [attr.stroke]="a.color"
          [attr.stroke-width]="2"
          [attr.opacity]="a.opacity"
        />
      }
      @case ('strikethrough') {
        <line
          [attr.x1]="a.rect.x"
          [attr.y1]="a.rect.y + a.rect.height / 2"
          [attr.x2]="a.rect.x + a.rect.width"
          [attr.y2]="a.rect.y + a.rect.height / 2"
          [attr.stroke]="a.color"
          [attr.stroke-width]="2"
          [attr.opacity]="a.opacity"
        />
      }
      @case ('comment') {
        <g class="comment">
          <circle
            [attr.cx]="a.rect.x + a.rect.width / 2"
            [attr.cy]="a.rect.y + a.rect.height / 2"
            [attr.r]="a.rect.width / 2"
            fill="#f59e0b"
            [attr.opacity]="a.opacity"
          />
          <text
            [attr.x]="a.rect.x + a.rect.width / 2"
            [attr.y]="a.rect.y + a.rect.height / 2 + 4"
            text-anchor="middle"
            fill="#ffffff"
            font-size="12"
            font-weight="700"
            >!</text
          >
          @if (a.id === selectedId()) {
            <g
              class="comment__bubble"
              [attr.transform]="
                'translate(' + (a.rect.x + a.rect.width + 6) + ',' + a.rect.y + ')'
              "
            >
              <rect
                width="170"
                height="48"
                rx="6"
                fill="#fffbeb"
                stroke="#f59e0b"
                stroke-width="1"
              />
              <text x="8" y="18" font-size="11" fill="#1f2937">{{ a.text }}</text>
              <text x="8" y="36" font-size="10" fill="#92400e">
                {{ a.author }}
              </text>
            </g>
          }
        </g>
      }
    }

    @if (tool() === 'select' && a.id === selectedId()) {
      <rect
        class="sel"
        [class.sel--locked]="a.locked"
        [attr.x]="a.rect.x"
        [attr.y]="a.rect.y"
        [attr.width]="a.rect.width"
        [attr.height]="a.rect.height"
      />
      @if (a.locked) {
        <g
          class="lock-badge"
          [attr.transform]="'translate(' + (a.rect.x + a.rect.width - 20) + ',' + (a.rect.y - 10) + ')'"
        >
          <circle cx="9" cy="9" r="9" fill="#1f2937" />
          <path
            d="M6 7V5.5a3 3 0 0 1 6 0V7h.5A1.5 1.5 0 0 1 14 8.5v4a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 4 12.5v-4A1.5 1.5 0 0 1 5.5 7H6zm1.5 0h3V5.5a1.5 1.5 0 0 0-3 0V7z"
            fill="#f59e0b"
            transform="scale(0.8) translate(2, 2)"
          />
        </g>
      } @else {
        <g class="handles">
          <rect
            class="handle"
            [attr.x]="a.rect.x - 5"
            [attr.y]="a.rect.y - 5"
            width="10"
            height="10"
            rx="2"
            [style.cursor]="handleCursor('nw')"
            (pointerdown)="onHandleDown($event, 'nw')"
          />
          <rect
            class="handle"
            [attr.x]="a.rect.x + a.rect.width / 2 - 5"
            [attr.y]="a.rect.y - 5"
            width="10"
            height="10"
            rx="2"
            [style.cursor]="handleCursor('n')"
            (pointerdown)="onHandleDown($event, 'n')"
          />
          <rect
            class="handle"
            [attr.x]="a.rect.x + a.rect.width - 5"
            [attr.y]="a.rect.y - 5"
            width="10"
            height="10"
            rx="2"
            [style.cursor]="handleCursor('ne')"
            (pointerdown)="onHandleDown($event, 'ne')"
          />
          <rect
            class="handle"
            [attr.x]="a.rect.x + a.rect.width - 5"
            [attr.y]="a.rect.y + a.rect.height / 2 - 5"
            width="10"
            height="10"
            rx="2"
            [style.cursor]="handleCursor('e')"
            (pointerdown)="onHandleDown($event, 'e')"
          />
          <rect
            class="handle"
            [attr.x]="a.rect.x + a.rect.width - 5"
            [attr.y]="a.rect.y + a.rect.height - 5"
            width="10"
            height="10"
            rx="2"
            [style.cursor]="handleCursor('se')"
            (pointerdown)="onHandleDown($event, 'se')"
          />
          <rect
            class="handle"
            [attr.x]="a.rect.x + a.rect.width / 2 - 5"
            [attr.y]="a.rect.y + a.rect.height - 5"
            width="10"
            height="10"
            rx="2"
            [style.cursor]="handleCursor('s')"
            (pointerdown)="onHandleDown($event, 's')"
          />
          <rect
            class="handle"
            [attr.x]="a.rect.x - 5"
            [attr.y]="a.rect.y + a.rect.height - 5"
            width="10"
            height="10"
            rx="2"
            [style.cursor]="handleCursor('sw')"
            (pointerdown)="onHandleDown($event, 'sw')"
          />
          <rect
            class="handle"
            [attr.x]="a.rect.x - 5"
            [attr.y]="a.rect.y + a.rect.height / 2 - 5"
            width="10"
            height="10"
            rx="2"
            [style.cursor]="handleCursor('w')"
            (pointerdown)="onHandleDown($event, 'w')"
          />
        </g>
      }
    }
  }

  @if (draft(); as d) {
    @switch (d.type) {
      @case ('rectangle') {
        <rect
          class="draft"
          [attr.x]="d.x"
          [attr.y]="d.y"
          [attr.width]="d.width"
          [attr.height]="d.height"
        />
      }
      @case ('circle') {
        <ellipse
          class="draft"
          [attr.cx]="d.x + d.width / 2"
          [attr.cy]="d.y + d.height / 2"
          [attr.rx]="d.width / 2"
          [attr.ry]="d.height / 2"
        />
      }
      @case ('arrow') {
        <line
          class="draft"
          [attr.x1]="d.x"
          [attr.y1]="d.y"
          [attr.x2]="d.x + d.width"
          [attr.y2]="d.y + d.height"
        />
      }
      @case ('line') {
        <line
          class="draft"
          [attr.x1]="d.x"
          [attr.y1]="d.y"
          [attr.x2]="d.x + d.width"
          [attr.y2]="d.y + d.height"
        />
      }
      @default {
        <rect
          class="draft"
          [attr.x]="d.x"
          [attr.y]="d.y"
          [attr.width]="d.width"
          [attr.height]="d.height"
        />
      }
    }
  }

  @if (draftDrawing(); as dd) {
    <path
      [attr.d]="pointsToSvgPath(dd.points)"
      [attr.stroke]="dd.color"
      [attr.stroke-width]="dd.strokeWidth"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.85"
    />
  }

  @if (tool() === 'eraser' && eraserPos(); as ep) {
    <!-- Nominal tool size boundary ring (when different from cut size) -->
    @if (baseEraserRadius() !== eraserRadius()) {
      <circle
        [attr.cx]="ep.x"
        [attr.cy]="ep.y"
        [attr.r]="baseEraserRadius()"
        fill="none"
        stroke="#94a3b8"
        stroke-width="1"
        stroke-dasharray="2 2"
        pointer-events="none"
      />
    }
    <!-- Actual precision cut footprint -->
    <circle
      [attr.cx]="ep.x"
      [attr.cy]="ep.y"
      [attr.r]="eraserRadius()"
      fill="rgba(239, 68, 68, 0.18)"
      stroke="#ef4444"
      stroke-width="1.5"
      stroke-dasharray="3 2"
      pointer-events="none"
    />
    <!-- Center pivot point -->
    <circle
      [attr.cx]="ep.x"
      [attr.cy]="ep.y"
      r="2"
      fill="#ef4444"
      pointer-events="none"
    />
  }
</svg>

@if (editingText(); as t) {
  <textarea
    #textEditor
    class="text-editor"
    wrap="off"
    spellcheck="false"
    [style.left.px]="t.rect.x"
    [style.top.px]="t.rect.y"
    [style.width.px]="t.rect.width"
    [style.height.px]="t.rect.height"
    [style.font-size.px]="t.fontSize"
    [style.font-family]="t.fontFamily"
    [style.font-weight]="t.fontWeight"
    [style.font-style]="t.italic ? 'italic' : 'normal'"
    [style.text-decoration]="t.underline ? 'underline' : 'none'"
    [style.color]="t.color"
    [style.text-align]="t.align"
    [style.text-transform]="t.transform ?? 'none'"
    [style.line-height]="t.lineHeight ?? 1.35"
    [style.letter-spacing.px]="t.letterSpacing ?? 0"
    [style.background-color]="t.backgroundColor && t.backgroundColor !== 'transparent' ? t.backgroundColor : 'rgba(255, 255, 255, 0.92)'"
    (input)="onEditInput($event)"
    (blur)="stopEditing()"
    (keydown)="onEditKeydown($event)"
  ></textarea>
}
