<section class="recent-page">
  <div class="pf-container">
    <header class="recent-page__header">
      <h1>Recent documents</h1>
      <p class="pf-text-muted">
        Stored locally in this browser. Nothing is uploaded.
      </p>
    </header>

    <div class="empty-state pf-card">
      <i class="fa-solid fa-clock-rotate-left empty-state__icon"></i>

      <p class="pf-text-muted">

      </p>
      <a class="pf-btn pf-btn--primary" routerLink="/editor">
        <i class="fa-solid fa-folder-open"></i> Open a PDF
      </a>
    </div>
  </div>
</section>
