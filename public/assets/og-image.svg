<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.15" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="320" fill="url(#accentGlow)" filter="blur(80px)" />
  <circle cx="1000" cy="450" r="280" fill="url(#accentGlow)" filter="blur(80px)" />

  <!-- Grid Pattern Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Privacy Security Badge -->
  <g transform="translate(100, 80)">
    <rect width="360" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#10b981" />
    <text x="42" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1">100% PRIVATE CLIENT-SIDE ENGINE</text>
  </g>

  <!-- Main Brand Title -->
  <g transform="translate(100, 210)">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      iPDF<tspan fill="url(#brandGrad)">Editor</tspan> Studio
    </text>
    <text y="70" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="500" fill="#cbd5e1" letter-spacing="-0.5">
      Professional PDF Editor &amp; Privacy-First Tools
    </text>
    <text y="125" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Zero Cloud Uploads · Edit, Merge, Split, Compress &amp; Sign Locally in Browser
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(100, 430)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="52" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5" />
      <text x="24" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#ffffff">✏️ PDF Editor</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(200, 0)">
      <rect width="170" height="52" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="24" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#ffffff">📑 Merge PDF</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(390, 0)">
      <rect width="160" height="52" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="24" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#ffffff">✂️ Split PDF</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(570, 0)">
      <rect width="190" height="52" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="24" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#ffffff">🗜️ Compress PDF</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(780, 0)">
      <rect width="170" height="52" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="24" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#ffffff">✍️ Sign &amp; Protect</text>
    </g>
  </g>

  <!-- Bottom Trust Line -->
  <g transform="translate(100, 560)">
    <text font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#64748b">
      🔒 Powered by WebAssembly &amp; Web Workers · Your files never leave your device · Free &amp; Open
    </text>
  </g>
</svg>
